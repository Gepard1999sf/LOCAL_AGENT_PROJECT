[package]
name = "codewhale-desktop"
version = "0.1.0"
description = "Desktop client for the CodeWhale coding agent, running fully local on Ollama"
authors = ["Stryker"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
name = "codewhale_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only loopback HTTP is used (CodeWhale app-server and Ollama), so TLS is left out.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
futures-util = "0.3"
getrandom = "0.3"
# Canonical paths without the `\\?\` prefix, which editors and Explorer do not expect.
dunce = "1"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Security",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Faster dev builds: optimize dependencies, keep our crate quick to rebuild.
[profile.dev.package."*"]
opt-level = 2
